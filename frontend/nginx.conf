server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API 反代到 web 容器（compose 服务名解析）
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # allauth 内部流程（SSO authorize/consent/callback）
    location /accounts/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
